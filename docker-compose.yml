services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    container_name: tsa_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - tsa-network
    volumes:
      - postgres_data:/var/lib/postgresql/

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER} -d ${DB_NAME}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: truck-signs-api-v2:latest
    container_name: tsa_backend
    restart: unless-stopped
    networks:
      - tsa-network
    ports:
      - "8020:8000" 
    env_file: .env   
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_files:
  media:

networks:
  tsa-network:
    driver: bridge
